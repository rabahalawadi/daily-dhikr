[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-dhikr"
version = "1.0.0"
description = "Automated Instagram content system for daily Islamic remembrance (adhkar and dua)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Daily Dhikr Automation" }
]
dependencies = [
    "pillow>=10.4.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
